name: Windows Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare release
        id: prepare
        uses: ./.github/actions/release-prepare
        with:
          updater-public-key: ${{ vars.QYWORK_UPDATER_PUBLIC_KEY }}
          updater-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run release gate
        run: bun run gate

      - name: Build installer and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis --config ../../.tmp/updater-config.json
          tagName: v__VERSION__
          releaseName: qywork v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          generateReleaseNotes: true
          releaseBody: ${{ steps.prepare.outputs.notes }}

      - name: Create checksum
        shell: bash
        run: |
          bundle=".tmp/cargo-target/x86_64-pc-windows-msvc/release/bundle/nsis"
          installers=("$bundle"/*.exe)
          # 没命中时 glob 原样留在数组里，先按文件存在与否清掉，报出来的个数才是真的。
          [ -f "${installers[0]}" ] || installers=()
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one NSIS installer in $bundle, found ${#installers[@]}." >&2
            exit 1
          fi
          ( cd "$bundle" && sha256sum "$(basename "${installers[0]}")" ) > SHA256SUMS-windows-x86_64.txt

      - name: Upload checksum to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release upload "v$version" SHA256SUMS-windows-x86_64.txt --clobber
