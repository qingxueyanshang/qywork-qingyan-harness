name: Linux Release

# 只生成 x86_64。Linux 安装包没有相当于 Apple 公证的系统签名环节，产物上唯一的签名是更新包签名，
# 由 release-prepare 强制要求，缺少时不生成安装包。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Linux x86_64 packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare release
        id: prepare
        uses: ./.github/actions/release-prepare
        with:
          updater-public-key: ${{ vars.QYWORK_UPDATER_PUBLIC_KEY }}
          updater-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Run release gate
        run: bun run gate

      # 不要删除 PATCHELF：linuxdeploy 为 AppDir/usr/bin 下的每个 ELF 添加 RUNPATH，经其自带的 patchelf 0.8
      # 修改后的 bun 单文件程序 qy 启动即段错误（exit 139），gtk 插件对它执行 ldd 失败，打包中止。
      # 经 setup-build 以 apt 安装的 patchelf 修改后的 qy 运行正常。
      - name: Build packages and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PATCHELF: /usr/bin/patchelf
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --target x86_64-unknown-linux-gnu --bundles deb,appimage --config ../../.tmp/updater-config.json
          tagName: v__VERSION__
          releaseName: QyWork v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          generateReleaseNotes: true
          releaseBody: ${{ steps.prepare.outputs.notes }}

      - name: Create checksum
        shell: bash
        run: |
          bundle=".tmp/cargo-target/x86_64-unknown-linux-gnu/release/bundle"
          : > SHA256SUMS-linux-x86_64.txt
          sum_one() {
            local dir="$1" pattern="$2"
            local packages=("$dir"/$pattern)
            # glob 未匹配时原样保留在数组中，先按文件是否存在清除，报告的个数才准确。
            [ -f "${packages[0]}" ] || packages=()
            if [ "${#packages[@]}" -ne 1 ]; then
              echo "Expected one $pattern in $dir, found ${#packages[@]}." >&2
              exit 1
            fi
            ( cd "$dir" && sha256sum "$(basename "${packages[0]}")" ) >> SHA256SUMS-linux-x86_64.txt
          }
          sum_one "$bundle/deb" "*.deb"
          sum_one "$bundle/appimage" "*.AppImage"

      - name: Upload checksum to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release upload "v$version" SHA256SUMS-linux-x86_64.txt --clobber
