name: macOS and Linux Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-build
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            target: aarch64-apple-darwin
            artifact: qywork-macos-arm64
          - name: macOS x64
            runner: macos-13
            target: x86_64-apple-darwin
            artifact: qywork-macos-x64
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: qywork-linux-x64

    env:
      CI: true

    steps:
      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.0-dev \
            patchelf \
            wget

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check version manifests
        run: bun run scripts/sync-version.ts --check

      - name: Build sidecar
        run: bun run build:agent

      - name: Run release gate
        run: bun run gate

      - name: Build macOS app bundle
        if: startsWith(matrix.runner, 'macos-')
        run: bun run --cwd apps/desktop tauri build --bundles app

      - name: Package macOS app
        if: startsWith(matrix.runner, 'macos-')
        env:
          ARTIFACT_DIR: .tmp/artifacts
          STAGE_DIR: .tmp/macos-dmg-stage
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          app=".tmp/cargo-target/release/bundle/macos/qywork.app"
          test -x "$app/Contents/MacOS/qywork"
          mkdir -p "$ARTIFACT_DIR" "$STAGE_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "$ARTIFACT_DIR/qywork_${version}_${{ matrix.target }}.app.zip"
          ln -s /Applications "$STAGE_DIR/Applications"
          cp -R "$app" "$STAGE_DIR/qywork.app"
          hdiutil create -volname qywork -srcfolder "$STAGE_DIR" \
            -ov -format UDZO "$ARTIFACT_DIR/qywork_${version}_${{ matrix.target }}.dmg"
          shasum -a 256 "$ARTIFACT_DIR"/*.app.zip "$ARTIFACT_DIR"/*.dmg > "$ARTIFACT_DIR/SHA256SUMS.txt"

      - name: Build Linux packages
        if: startsWith(matrix.runner, 'ubuntu-')
        run: bun run --cwd apps/desktop tauri build --bundles deb,appimage

      - name: Collect Linux packages
        if: startsWith(matrix.runner, 'ubuntu-')
        env:
          ARTIFACT_DIR: .tmp/artifacts
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p "$ARTIFACT_DIR"
          find ".tmp/cargo-target/release/bundle" -type f \
            \( -name "qywork_${version}_*.deb" -o -name "qywork_${version}_*.AppImage" \) \
            -exec cp {} "$ARTIFACT_DIR/" \;
          test -n "$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -print -quit)"
          shasum -a 256 "$ARTIFACT_DIR"/*.deb "$ARTIFACT_DIR"/*.AppImage > "$ARTIFACT_DIR/SHA256SUMS.txt"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4 # v4
        with:
          name: ${{ matrix.artifact }}
          path: .tmp/artifacts
          if-no-files-found: error
          retention-days: 14
