name: CI

# 日常门禁：每次分支 push 与每个 pull request 都运行一次完整的 `bun run gate`，
# 其中的 sidecar 编译同时构建网页。发布工作流只在手动触发时运行，其通过结果不能代表日常提交。
#
# 三个平台同时运行：安装包分 Windows、macOS 与 Linux 三种，而 gate 中的 cargo check 按运行平台
# 选择条件编译分支，两个 externalBin 按运行平台的三元组编译。只在一个平台运行时，另外两个平台的
# 编译错误到发布当天才暴露。前置步骤与发布工作流共用 .github/actions/setup-build，此处不另行复制。

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# 同一分支或 PR 上的新推送取消尚未结束的旧运行。group 名不得与发布工作流的 windows-release
# 相同：相同时，一次 push 会取消正在生成安装包的发布。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 三个平台均为冷编译，没有 Rust 缓存；Windows 在 45 分钟的时限内完成，另两个平台耗时更长。
    timeout-minutes: 60
    strategy:
      # 一个平台失败时仍需查看另外两个平台是否出于同一原因，因此不提前取消同批的其余 job。
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Run gate
        run: bun run gate
