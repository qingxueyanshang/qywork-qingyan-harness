name: Set up qywork build
description: 装 Bun 与 Rust、备齐 Linux 系统库、装依赖、核对版本清单、编译 sidecar。三端的 CI 与发布共用同一份。

# 第三方 action 的 pin 与 sidecar 的编译时机只写在这里。几个工作流各抄一遍的话，
# 改了 pin 只改一处的表现是「一条工作流用新版本、另一条用旧版本」，而两边都是绿的。
#
# 全部 run 步骤用 bash：Windows runner 上是 Git Bash，三端都有。写 pwsh 会让 Linux 与
# macOS 的 job 依赖镜像里预装的 PowerShell，那不是 runner 的契约。

inputs:
  targets:
    description: 要额外装的 Rust 目标三元组，逗号分隔。留空即只装 runner 自己的宿主目标。
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: ${{ inputs.targets }}

    # Tauri 在 Linux 上链接 WebKitGTK、libxdo 与托盘库，runner 镜像里不预装。缺任何一个，
    # gate 的 cargo check 就在对应 `*-sys` 的 build script 上以 101 退出，报的是
    # pkg-config 找不到该库。patchelf 不属于编译依赖，是 AppImage 打包要用的。
    - name: Install Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # office 的 worker 是 Python，门禁跑它的纯逻辑单测（`bun run test:office`）。
    # 用 runner 自带的解释器建虚拟环境，按产品附带的固定版本清单装依赖；
    # 系统解释器在 Ubuntu 上禁止直接 pip 安装，所以不装进系统目录。
    - name: Prepare Office worker Python
      shell: bash
      run: |
        if command -v python3 >/dev/null 2>&1; then BASE=python3; else BASE=python; fi
        "$BASE" -m venv .tmp/office-venv
        if [ -x .tmp/office-venv/Scripts/python.exe ]; then PY="$PWD/.tmp/office-venv/Scripts/python.exe"; else PY="$PWD/.tmp/office-venv/bin/python"; fi
        "$PY" -m pip install -r packages/runtime/office/requirements.txt
        echo "QYWORK_TEST_PYTHON=$PY" >> "$GITHUB_ENV"

    - name: Check version manifests
      shell: bash
      run: bun run scripts/sync-version.ts --check

    # 这一步必须在 `bun run gate` 之前。gate 里的 cargo check 会跑 tauri 的构建脚本，
    # 而 tauri.conf.json 把 bin/qy 声明成 externalBin：干净 runner 上这个文件不存在，
    # 构建脚本报 `resource path bin\qy-... doesn't exist` 并以 101 退出。
    #
    # 另一个 externalBin（bin/qy-computer-host）不在这里准备：外壳的构建脚本在同一次
    # 编译里出它，CI 与本地因此拿到的都是与外壳同源的 worker。
    #
    # 产物按 `rustc -vV` 的宿主三元组命名，因此 runner 架构必须与要出的包一致：
    # arm64 runner 上准备不出 x86_64 的资产，sidecar 编完还会就地自检运行一次。
    - name: Build sidecar
      shell: bash
      run: bun run build:agent
